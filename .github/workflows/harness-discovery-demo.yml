name: harness-discovery demo GIF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/harness-discovery/assets/demo.tape
      - .github/workflows/harness-discovery-demo.yml
permissions:
  contents: read
# A newer render replaces an older one, which only uploads an artifact.
concurrency:
  group: harness-discovery-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Render the package's demo GIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # No install scripts: the app's macOS-only builds are not needed here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The tape packs this checkout and installs that .tgz for the quick start's release URL.
      - run: pnpm build
        working-directory: packages/harness-discovery
      # With no path the action only installs vhs; the tape runs from the package folder.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.10.0
      - run: vhs assets/demo.tape
        working-directory: packages/harness-discovery
      # The workflow only uploads the GIF. A re-rendered GIF is committed by hand to
      # packages/harness-discovery/assets/demo.gif, as CONTRIBUTING.md describes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: packages/harness-discovery/assets/demo.gif
