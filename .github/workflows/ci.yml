name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  # The jobs that package the app run on Node 24, the floor the README states.
  acceptance:
    name: Acceptance
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:acceptance
      - run: pnpm make
  examples:
    name: Examples
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/shellcheck
      - run: shellcheck scripts/*.sh examples/*/run.sh .github/assets/screenshots.sh
      - run: scripts/run-examples.sh
  # packages/local-session-extractor: the package's own checks, from its folder.
  package-test:
    name: Package test (Node ${{ matrix.node }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["24", "26"]
    defaults:
      run:
        working-directory: packages/local-session-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The install runs from the repo root and builds the package's dist/ through the root's prepare script.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm type-check
      - run: pnpm test
  package-lint:
    name: Package lint
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/local-session-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # The install runs from the repo root and builds the package's dist/ through the root's prepare script.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
  package-examples:
    name: Package install and examples
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/local-session-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # The install runs from the repo root and builds the package's dist/ through the root's prepare script.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: scripts/smoke-install.sh
      - uses: ./.github/actions/shellcheck
      - run: shellcheck -x examples/*/run.sh scripts/*.sh assets/demo-setup.sh
      - run: scripts/run-examples.sh
      - run: node scripts/readme-blocks.mjs
  # packages/harness-discovery: the package's own checks, from its folder.
  # The package supports macOS and Linux, so its tests and smoke install run on both.
  harness-discovery-test:
    name: harness-discovery test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26"]
    defaults:
      run:
        working-directory: packages/harness-discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # No install scripts: the app's macOS-only native builds are not
      # needed here, so the same steps run on Linux. The package's dist/ is built next.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
      - run: scripts/smoke-install.sh
  harness-discovery-lint:
    name: harness-discovery lint
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/harness-discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      # The install runs from the repo root and builds the package's dist/ through the root's prepare script.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
  harness-discovery-examples:
    name: harness-discovery examples
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/harness-discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # The install runs from the repo root and builds the package's dist/ through the root's prepare script.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: ./.github/actions/shellcheck
      - run: shellcheck -x scripts/*.sh examples/*/run.sh
      - run: scripts/run-examples.sh
      - run: scripts/readme-blocks.sh
